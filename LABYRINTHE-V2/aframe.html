<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
        </head>
            <body>
                <a-scene>
                    <a-assets>
                        <img id="texture" src="./assets/béton_texture.jpg">
                        <img id="texture2" src="./assets/statue/statue.jpg">
                        
                        <a-asset-item id="obj-ladder" src="./assets/ladder/ladder.obj"></a-asset-item>
                        <a-asset-item id="mtl-ladder" src="./assets/ladder/ladder.mtl"></a-asset-item>

                        <a-asset-item id="obj-statue" src="./assets/statue/statue.obj"></a-asset-item>
                        <a-asset-item id="mtl-statue" src="./assets/statue/statue.mtl"></a-asset-item>
                    </a-assets>
      
      
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 4" position="2.025 1 -4"></a-box>
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 4" position="-2.025 1 -4"></a-box>
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 1.05" position="1.525 1 -1.972" rotation="0 90 0"></a-box>
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 1.05" position="-1.525 1 -6.025" rotation="0 90 0"></a-box>
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 1" position="-1.5 1 -5" rotation="0 90 0"></a-box>
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 1" position="1.5 1 -4" rotation="0 90 0"></a-box>
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 1" position="-0.5 1 -4" rotation="0 90 0"></a-box>
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 1" position="0.5 1 -3" rotation="0 90 0"></a-box>
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 2.05" position="-1.025 1 -1.972" rotation="0 90 0"></a-box>
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 2.05" position="1.025 1 -6.025" rotation="0 90 0"></a-box>
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 1.05" position="1.025 1 -2.5"></a-box>
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 1" position="-1.005 1 -2.5"></a-box>
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 1" position="1 1 -5.5"></a-box>
                    <a-box src="#texture" sposition="5 1 -4" scale="0.05 2 2" position="0 1 -3.975"></a-box>
                    <a-box material="src: #texture; repeat: 5 5" 5 1 -4" scale="0.05 4.1 4.1" position="0 2 -4" rotation="0 0 90"></a-box>
 
                    <a-plane material="src: #texture; repeat: 4 4" position="0 0 -4" rotation="-90 0 0" width="4" height="4" scale="4 4 1"></a-plane>

                    <a-sky color="black"></a-sky>

                    <a-entity light="color: #1123ac; type: point; intensity: 5; angle: 60.5"></a-entity>
                    <a-entity light="angle: 60.32; color: #1123ac; intensity: 5; type: point" position="0 3.5 -5"></a-entity>
                    <a-entity light="angle: 60.32; color: #2bac11; intensity: 5; type: point" position="0 3.5 -9"></a-entity>
                    <a-entity light="angle: 60.32; color: #1123ac; intensity: 5; type: point" position="3.5 1 -4"></a-entity>
                    <a-entity light="angle: 60.32; color: #1123ac; intensity: 5; type: point" position="-3 1 -4"></a-entity>
                    
                    <a-entity id="ladder" position="-0.5 0.3 -1.5" obj-model="mtl: ./assets/ladder/ladder.mtl; obj: ./assets/ladder/ladder.obj"></a-entity>

                    <a-entity id="statue" position="-1.5 0.0 -5.5" scale="0.05 0.05 0.05" rotation="-90 90 0"
                    obj-model="obj: #obj-statue; mtl : #mtl-statue"></a-entity>

                </a-scene>
            </body>
</html>
